		024C9F3E2F1EAE86001CD8DD /* Copy Trusted Certificates from Wallet/Certificates */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/Wallet/Certificates",
			);
			name = "Copy Trusted Certificates from Wallet/Certificates";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Wallet/Certificates",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n  set -e\n\n  : \"${BUILT_PRODUCTS_DIR:?}\"\n  : \"${UNLOCALIZED_RESOURCES_FOLDER_PATH:?}\"\n\n  SOURCE_DIR=\"${SRCROOT}/Wallet/Certificates\"\n  DEST_DIR=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Wallet/Certificates\"\n\n  # Reader trust anchors sit at the top level, TLS pinning material in Pinning/, and the two are\n  # copied separately. The destination is cleared so a certificate that moves between them cannot\n  # linger from an earlier build.\n  rm -rf \"${DEST_DIR}\"\n  mkdir -p \"${DEST_DIR}\" \"${DEST_DIR}/Pinning\"\n\n  if [ -d \"${SOURCE_DIR}\" ]; then\n      echo \"Copying reader trust anchors from ${SOURCE_DIR} to ${DEST_DIR}\"\n      find \"${SOURCE_DIR}\" -maxdepth 1 -name \"*.der\" -exec cp {} \"${DEST_DIR}/\" \\;\n      echo \"Copied $(find \"${SOURCE_DIR}\" -maxdepth 1 -name \"*.der\" | wc -l | tr -d ' ') reader certificate(s)\"\n  else\n      echo \"Warning: ${SOURCE_DIR} does not exist\"\n  fi\n\n  if [ -d \"${SOURCE_DIR}/Pinning\" ]; then\n      echo \"Copying pinning certificates from ${SOURCE_DIR}/Pinning to ${DEST_DIR}/Pinning\"\n      find \"${SOURCE_DIR}/Pinning\" -maxdepth 1 -name \"*.der\" -exec cp {} \"${DEST_DIR}/Pinning/\" \\;\n      echo \"Copied $(find \"${SOURCE_DIR}/Pinning\" -maxdepth 1 -name \"*.der\" | wc -l | tr -d ' ') pinning certificate(s)\"\n  else\n      echo \"Warning: ${SOURCE_DIR}/Pinning does not exist\"\n  fi\n";
		};
